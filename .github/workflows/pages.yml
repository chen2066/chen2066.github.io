name: Publish Darkest Reflex Remote P2 Browser Guest
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'join/**'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
      - '.github/tests/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guest-only site
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone WebRTC guest and codec
        run: node .github/tests/site.mjs
      - name: Stage only public guest content
        run: |
          mkdir -p _publish/join
          cp index.html LICENSE _publish/
          cp join/index.html join/guest.js join/guest.css _publish/join/
          touch _publish/.nojekyll
          test -s _publish/join/guest.js
      - uses: actions/configure-pages@v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _publish
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm public HTTPS P2 guest is reachable
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL --connect-timeout 12 --max-time 20 https://chen2066.github.io/join/ -o /tmp/reflex-guest.html \
              && grep -q 'DARKEST REFLEX' /tmp/reflex-guest.html \
              && curl -fsSL --connect-timeout 12 --max-time 20 https://chen2066.github.io/join/guest.js -o /tmp/reflex-guest.js \
              && grep -q 'RTCPeerConnection' /tmp/reflex-guest.js; then
              echo 'PASS: live GitHub Pages hosts the P2 guest HTML and WebRTC JavaScript'
              exit 0
            fi
            sleep 10
          done
          echo 'FAIL: GitHub Pages not reachable yet. Confirm Settings > Pages > GitHub Actions.' >&2
          exit 1
